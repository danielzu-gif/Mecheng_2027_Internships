# =============================================================================
# targets.yml — everything you tune lives here. watcher.py never needs editing.
# =============================================================================

season:
  term: summer
  year: 2027
  # A posting with no season anywhere in the title OR description, first seen
  # inside this window, is treated as "probably the target season" rather than
  # thrown away. Aerospace opens Aug 2026; most ME programs Oct 2026 - Jan 2027.
  assume_window: ["2026-07-15", "2027-03-31"]
  # Flip to true if you decide a fall/spring co-op is worth hearing about.
  allow_offseason: false

# -----------------------------------------------------------------------------
# RANKS — the thing that decides how loud a posting is allowed to be.
#   S  its own notification, priority 5, never capped away, never silenced.
#   A  its own notification at normal priority, capped, overflow rolled up.
#   B  never alone — folded into one roll-up notification.
#   C  board and brief only.
# First matching rule wins, checked S then A then B.
# Want fewer S? Raise min_score to 10. Want tier 2 in the loud lane? Set
# S.max_tier to 2. This block is the volume knob.
# -----------------------------------------------------------------------------
# A letter may hold a LIST of rules; matching any one of them wins that rank.
#
# Locking S and A to a CONFIRMED season killed the noise and most of the signal
# with it: Rocket Lab's entire intern slate, scoring 9 to 11, fell to rank B
# because Rocket Lab never writes "Summer 2027" anywhere in the req. Explicit
# off-season reqs are now caught by the season classifier itself, so the ranks
# no longer have to do that job by refusing everything unconfirmed.
ranks:
  S:
    - {max_tier: 1, min_score: 8, terms: [target]}
    # tier 1, high score, and pointed at your focus areas. A recruiter not
    # typing the season is not a reason to bury this one.
    - {max_tier: 1, min_score: 9, terms: [assumed], require_focus: true}
  A:
    - {max_tier: 2, min_score: 6, terms: [target]}
    - {max_tier: 2, min_score: 7, terms: [assumed]}
    # "unknown" almost always means a tracker truncated the title so the season
    # was unreadable, not that the season is wrong. A tier 1 bullseye should not
    # be punished for someone else's string slicing.
    - {max_tier: 1, min_score: 9, terms: [unknown], require_focus: true}
  B: {max_tier: 3, min_score: 5, terms: [target, assumed, unknown]}

routing:
  digest_min_score: 3          # below this a posting doesn't exist at all
  instant_max_age_hours: 72    # an old A gets rolled up; an old S still pushes
  max_instant_top: 8           # individual S pushes per run, rest roll up as S
  max_instant_strong: 5        # individual A pushes per run
  group_company_at: 3          # 3+ new roles at one company = one notification
  max_description_fetches: 40  # per run, for tracker rows with no season in title
  description_timeout: 8       # seconds per description fetch

  # A req open this long is probably filled. "Probably" is doing real work
  # here: aerospace intern reqs routinely sit open six to eight weeks, and at
  # 14 days this rule was hiding a fifth of the live board. Never alerted,
  # never boarded, so keep it generous. Top rank gets the longer leash.
  max_posting_age_days: 30
  max_posting_age_days_top: 45

  # Midnight to 8am ET: only rank S is allowed through. Everything else waits
  # for the next brief, so an overnight flood is one line when you wake up.
  quiet_hours_utc: [4, 12]

  # 12:00 UTC = 8am ET, which is when the overnight quiet-hours backlog is
  # actually useful. 23:00 UTC = 7pm ET. The previous [4, 16] put the first
  # brief at midnight ET, i.e. at the START of the quiet window, so anything
  # held overnight waited until lunch.
  # These are EDT. In winter, shift both by one to [13, 0] to hold the clock.
  brief_hours_utc: [12, 23]
  brief_min_gap_hours: 8
  brief_detail_caps: {S: 12, A: 10, B: 6, C: 0}   # C shows as a count only
  heartbeat: true              # silent daily "still running" line when nothing hits

  # The board is a short list of what is actually actionable, not an archive.
  board_active_days: 10        # unticked postings drop off after this
  applied_visible_hours: 3     # a ticked posting clears the board this fast
  board_title: "📋 Summer 2027 internship board"
  widenet_title: "🕸️ Wide net — everything else that matched"
  state_keep_days: 400

# Companies you never want to hear from again, whatever they post.
company_blocklist: []

# -----------------------------------------------------------------------------
# COMPANIES
#   tier 1 = your actual trajectory. Generic "Engineering Intern" titles count
#            here, because SpaceX et al. don't put "Mechanical" in the title.
#   tier 2 = strong hardware companies worth a same-day look.
#   tier 3 = fine, but digest-only unless the role is a bullseye.
#
#   ats/board = polled directly, so you get the real publish timestamp instead
#               of waiting for a tracker repost. verified: false means I guessed
#               the token — run `python watcher.py --verify-boards` and fix.
# -----------------------------------------------------------------------------
