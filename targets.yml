# -----------------------------------------------------------------------------
# ROLE SCORING — a title accumulates points, it doesn't pass/fail on one word.
# -----------------------------------------------------------------------------
roles:
  # +5 — unmistakably your degree
  core:
    - mechanical engineer
    - mechanical engineering
    - mechanical design
    - mechanical systems
    - mechanical intern
    - mechanical co-op
    - mechanical
    - mechatronics
    - electromechanical

  # +5 — where you're actually pointed. Also drives the 🚀 tag on the push.
  focus:
    - propulsion
    - electric propulsion
    - thermal
    - heat transfer
    - thermal management
    - battery pack
    - battery thermal
    - powertrain
    - drivetrain
    - turbomachinery
    - rotor
    - flight hardware
    - launch vehicle
    - avionics mechanical
    - fluid systems
    - cooling
    - cryogenic
    - combustion
    - energy systems
    - power electronics

  # +3 — adjacent work you'd take in a heartbeat
  adjacent:
    - hardware engineer
    - hardware engineering
    - design engineer
    - product design
    - r&d engineer
    - prototype
    - test engineer
    - integration and test
    - structures
    - stress analysis
    - simulation
    - fea
    - cfd
    - cad
    - gse
    - ground support equipment
    - manufacturing engineer
    - manufacturing engineering
    - process engineer
    - tooling
    - additive manufacturing
    - robotics engineer
    - controls engineer
    - validation engineer
    - systems engineer
    - aerospace engineer
    - vehicle engineer
    - reliability engineer

  # +2, and ONLY counted for tier 1/2 companies. This is the SpaceX rule:
  # they post "Summer 2027 Engineering Internship/Co-op" with no discipline.
  generic:
    - engineering intern
    - engineering internship
    - engineer intern
    - engineering co-op
    - engineering student
    - intern - engineering
    - undergraduate intern
    - technical intern

  # A title that belongs to another discipline. Dropped outright UNLESS the
  # job description names mechanical engineering as an eligible major, which is
  # how the good "Electrical/Mechanical Engineering Intern" reqs still get in.
  other_discipline:
    - electrical engineer
    - electrical engineering
    - chemical engineer
    - chemical engineering
    - civil engineer
    - civil engineering
    - industrial engineer
    - industrial engineering
    - biomedical engineer
    - environmental engineer
    - petroleum engineer
    - nuclear engineer
    - materials engineer
    - optical engineer
    - photonics
    - rf engineer
    - silicon engineer
    - electronics engineer
    - firmware
    - embedded software
    - power systems engineer
    - network engineer
    - quality assurance
    - supplier quality
    - operations intern
    - business operations
    - talent
    - people operations
    - web services

  # -8 — kills the match outright. Matched on WORD BOUNDARIES, so "sales" no
  # longer takes out "Salesforce Hardware Intern" and "legal" no longer takes
  # out "Paralegal". Same for locations below: "india" was killing every
  # posting in Indianapolis.
  negative:
    - software engineer intern
    - software engineering intern
    - software developer
    - data scientist
    - data engineer
    - machine learning
    - deep learning
    - full stack
    - frontend
    - backend
    - web developer
    - cybersecurity
    - security engineer
    - quantitative
    - trading
    - investment
    - sales
    - marketing
    - human resources
    - recruiting
    - accounting
    - finance intern
    - legal
    - supply chain
    - logistics
    # NOT bare "environmental": environmental test engineering is thermal vac
    # and vibe work, which is squarely yours.
    - environmental science
    - environmental health
    - civil engineer
    - construction
    - geotechnical
    - chemical process
    - biomedical
    - clinical
    - nursing

  # -4 — usually not open to a BSE undergrad
  eligibility_penalty:
    - phd
    - ph.d
    - doctoral
    - master's
    - masters
    - "m.s."
    - mba
    - returning intern
    - returning student
    - high school

# Locations you can't take. Matched against the location string only.
location_blocklist:
  # "ontario" on its own blocks Ontario, California and Ontario, Oregon. The
  # Canadian one always arrives with "Canada" or the ON code attached.
  - canada
  - new zealand
  - auckland
  - quebec
  - alberta
  - british columbia
  - united kingdom
  - india
  - germany
  - france
  - spain
  - mexico
  - japan
  - singapore
  - australia
  - israel
  - netherlands
  - poland

