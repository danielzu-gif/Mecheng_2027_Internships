name: internship watcher

on:
  schedule:
    # Recruiting hours, US: every 20 min, 12:00-03:00 UTC (8am-11pm ET).
    # Aerospace drops land in the morning and postings close fast, so the
    # tight cadence only matters here.
    - cron: "*/20 12-23 * * *"
    - cron: "*/20 0-3 * * *"
    # Overnight: hourly is plenty. Quiet hours in targets.yml mean only rank S
    # is allowed to make noise in this window anyway.
    - cron: "0 4-11 * * *"
    # Sunday 09:00 UTC — confirm every ATS token still resolves.
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | seed | brief | board | doctor | verify-boards | why"
        required: false
        default: "run"
      query:
        description: "for mode=why: a company or role to explain, e.g. 'rocket lab'"
        required: false
        default: ""

permissions:
  contents: write
  issues: write        # the board lives in an issue so the checkboxes are tappable

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.schedule != '0 9 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # optional: a second topic carrying rank S only, so top-tier drops
          # can have their own sound in the ntfy app
          NTFY_TOPIC_TOP: ${{ secrets.NTFY_TOPIC_TOP }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            dry-run)       python watcher.py --dry-run --explain ;;
            seed)          python watcher.py --seed ;;
            brief|digest)  python watcher.py --brief ;;
            board)         python watcher.py --board-only ;;
            doctor)        python watcher.py --doctor ;;
            verify-boards) python watcher.py --verify-boards ;;
            why)           python watcher.py --why "${{ github.event.inputs.query }}" ;;
            *)             python watcher.py ;;
          esac

      - name: Commit state
        if: >-
          github.event.inputs.mode != 'dry-run' &&
          github.event.inputs.mode != 'verify-boards' &&
          github.event.inputs.mode != 'why' &&
          github.event.inputs.mode != 'doctor'
        run: |
          git config user.name  "internship-watcher"
          git config user.email "actions@github.com"
          git add state/ docs/
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have pushed while this one was working. State is
          # regenerated from scratch every run and the applied ticks live in the
          # issue, not in git, so losing one state commit costs nothing. Failing
          # the job over it just paints the run history red for no reason.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin ${{ github.ref_name }} && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard "origin/${{ github.ref_name }}" 2>/dev/null || true
            sleep $((i * 7))
          done
          echo "::notice::another run won the race for state/, skipping this commit"
          exit 0

  verify:
    if: github.event.schedule == '0 9 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Fails the job if a board token has gone stale, which sends you the
      # standard GitHub "workflow failed" email.
      - run: python watcher.py --verify-boards
